{% extends "base.html" %}
{% block title %}Sign In — Echo Journal{% endblock %}
{% block content %}
<div class="auth-card-container">
  <div class="auth-header">
    <h1 class="auth-title">Welcome Back</h1>
    <p class="auth-subtitle">Open your quiet reflection space. Password verified via scrypt.</p>
  </div>

  <form method="POST" action="{{ url_for('auth.login') }}" class="standard-form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    
    <div class="form-group">
      <label for="identifier" class="form-label">Username or Email</label>
      <input type="text" id="identifier" name="identifier" value="{{ identifier or '' }}" required autofocus class="form-input" autocomplete="username">
    </div>

    <div class="form-group">
      <label for="password" class="form-label">Password</label>
      <input type="password" id="password" name="password" required class="form-input" autocomplete="current-password">
    </div>

    <div class="form-actions">
      <button type="submit" class="button-primary full-width">Sign In</button>
    </div>
  </form>

  <div class="auth-footer-link">
    Don't have a private journal yet? <a href="{{ url_for('auth.register') }}">Create an account</a>
  </div>
</div>
{% endblock %}
